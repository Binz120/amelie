name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML parser, shellcheck and ImageMagick
        run: |
          python3 -m pip install --quiet --user pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck imagemagick fonts-dejavu-core >/dev/null

      - name: Palette, configs and assets
        run: scripts/verify.sh --fast

      - name: Shell scripts
        run: shellcheck --severity=warning install.sh uninstall.sh scripts/*.sh hooks/theme-set.d/*

      - name: Python sources
        run: |
          python3 -m compileall -q scripts extras
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').glob('*.py')]; ast.parse(pathlib.Path('extras/omarchy-waterfox-theme').read_text()); print('python sources parse')"

      - name: Wallpaper generator still runs
        run: |
          python3 scripts/make-background.py --out /tmp/bg.jpg
          test "$(identify -format '%wx%h' /tmp/bg.jpg)" = "2560x1440"
